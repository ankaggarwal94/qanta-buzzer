# CS321M Final Project -- Modal A100 production configuration
# Full metric computation for Phases 4-6 (CSLI, calibration, StopDFF)
# Based on default.yaml tuned for A100 80GB compute

# Project metadata
cs321m:
  project_name: "does-proxy-preserve-decision"
  compute_lane: "modal_a100"
  budget_limit_usd: 300
  spend_log_path: "PROJECT_WIKI/TRANSCRIPTS/modal_spend.log"
  gpu: "A100-80GB"
  smoke: false
  stages:
    - build_mc_dataset
    - run_baselines
    - train_ppo
    - evaluate_all
    - compute_csli
    - compute_prefix_calibration
    - compute_stopdff

# Data settings for full production run
data:
  csv_path: "questions.csv"
  K: 4
  distractor_strategy: "sbert_profile"  # Production quality
  variable_K: false
  min_K: 2
  max_K: null
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_questions: null  # Use all 20,407 questions
  shuffle_seed: 789685  # Fresh split seed from Phase 2

answer_profiles:
  max_tokens_per_profile: 2000
  min_questions_per_answer: 1
  leave_one_out: true

likelihood:
  model: "t5-base"  # GPU-accelerated, production quality
  embedding_model: "all-MiniLM-L6-v2"
  beta: 5.0
  cache_embeddings: true
  cache_dir: "cache/embeddings"
  batch_size: 64  # Larger batch for A100 80GB
  max_length: 512

environment:
  reward_mode: "time_penalty"
  seed: 13
  wait_penalty: 0.05
  early_buzz_penalty: 0.2
  buzz_correct: 1.0
  buzz_incorrect: -0.5
  max_steps: 20
  opponent_buzz_model:
    type: "none"
  end_mode: "force_commit"
  no_buzz_reward: 0.0

mc_guards:
  alias_edit_distance_threshold: 0.2
  duplicate_token_overlap_threshold: 0.8
  max_length_ratio: 3.0

bayesian:
  threshold_sweep: [0.5, 0.6, 0.7, 0.8, 0.9]
  alpha: 10.0

ppo:
  seed: 13
  total_timesteps: 100000
  learning_rate: 3e-4
  n_steps: 128
  batch_size: 64  # Larger batch for A100 80GB
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  target_kl: 0.03
  policy_kwargs:
    net_arch: [64, 64]

evaluation:
  metrics:
    - accuracy
    - reward
    - buzz_position
    - calibration
    - per_category
  compute_sq: true  # Full S_q scoring metric
  run_choices_only: true  # Control experiment
  run_shuffle: true
  bootstrap_ci_samples: 1000  # Full CI for paper
  save_predictions: true
  prediction_dir: "results/predictions"
