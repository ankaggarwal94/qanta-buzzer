name: Audit artifact verification

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas pyyaml

      - name: Verify committed audit artifacts
        run: |
          python scripts/verify_audit_release.py

      - name: Test audit release verifier
        run: |
          pytest tests/test_verify_audit_release.py -q
