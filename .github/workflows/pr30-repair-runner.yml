name: PR30 bounded repair runner

on:
  push:
    branches:
      - codex/post18-v5-code
    paths:
      - .github/pr30-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post18-v5-code
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record transaction head
        shell: bash
        run: echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply adjudicated patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/pr30_split_metadata_repair.py

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install flake8
          pip install -e '.[dev]'

      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py -q --tb=short
          flake8 scripts/build_mc_dataset.py scripts/stopdff_v5/producers.py tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py --select=E9,F63,F7,F82 --show-source --statistics

      - name: Full verification
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/ -q --tb=short

      - name: Commit and CAS-push repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/post18-v5-code
          REMOTE_HEAD="$(git rev-parse origin/codex/post18-v5-code)"
          test "$REMOTE_HEAD" = "$START_HEAD" || {
            echo "Branch moved from $START_HEAD to $REMOTE_HEAD; refusing to push"
            exit 78
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/stopdff_v5/REPRODUCTION.md \
            scripts/build_mc_dataset.py scripts/stopdff_v5/producers.py \
            tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py
          git commit -m "Fix retained split metadata contract"
          git push origin HEAD:codex/post18-v5-code
