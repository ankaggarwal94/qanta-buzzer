name: Frozen Jane Modal v6 cumulative-budget constrained candidate

on:
  push:
    branches: [ops/jane-modal-pilot-20261001]
    paths: [.github/workflows/jane-modal-pilot.yml]

permissions:
  contents: read

concurrency:
  group: jane-modal-v6-20261001
  cancel-in-progress: false

jobs:
  frozen-pilot:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/jane-modal-pilot-20261001' &&
      github.actor == 'ankaggarwal94' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: launch frozen Jane Modal v6 global-budget candidate 20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    steps:
      - name: Checkout the exact reviewed launch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned submission client and pure guard test dependency
        run: python -m pip install --disable-pip-version-check 'modal==1.6.0' 'pytest==8.3.5' 'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Test budget, public-data, and workflow guards before credentials are exposed
        run: >-
          python -m pytest --noconftest tests/test_modal_jane_pilot.py
          tests/test_jane_gpu_backend.py tests/test_jane_output_constraints.py
          tests/test_unpack_jane_public_inputs.py -q
      - name: Restore only the exact frozen public input bytes
        run: >-
          python scripts/unpack_jane_public_inputs.py
          --archive modal_pilot_data/public_inputs.zip
          --out-dir modal_pilot_data/public
      - name: Validate frozen public jobs without cloud operations
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_jane_pilot plan
          --public-dir modal_pilot_data/public
          --source-commit "$SOURCE_COMMIT" --budget-usd 9.34
      - name: Launch the single attached allocation with existing credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m scripts.modal_jane_pilot launch
          --public-dir modal_pilot_data/public
          --source-commit "$SOURCE_COMMIT" --budget-usd 9.34
          --out results/jane_modal_gpu_v6_20261001
      - name: Retain full and partial execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-modal-pilot-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/jane_modal_gpu_v6_20261001/
          if-no-files-found: warn
          retention-days: 30
