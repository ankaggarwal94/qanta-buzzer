name: PR30 adapter execution repair

on:
  push:
    branches:
      - codex/post18-v5-code
    paths:
      - .github/workflows/pr30-adapter-execution-repair.yml

permissions:
  contents: read

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post18-v5-code
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify bounded transaction head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e30bba609e05192021b7e06263eddf25737f4f27"
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply adjudicated repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/pr30_adapter_execution_repair.py
          python -m py_compile \
            scripts/run_stopdff_v5_local.py \
            tests/test_pr30_control_repairs.py
          rm .github/pr30_adapter_execution_repair.py
          rm .github/workflows/pr30-adapter-execution-repair.yml
          git diff --check

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install flake8
          pip install -e '.[dev]'

      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/test_pr30_control_repairs.py -q --tb=short
          flake8 \
            scripts/run_stopdff_v5_local.py \
            tests/test_pr30_control_repairs.py \
            --select=E9,F63,F7,F82 --show-source --statistics

      - name: Commit and compare-and-swap push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/post18-v5-code
          test "$(git rev-parse origin/codex/post18-v5-code)" = "$START_HEAD" || {
            echo "Branch moved during the bounded transaction; refusing to push"
            exit 78
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/pr30_adapter_execution_repair.py \
            .github/workflows/pr30-adapter-execution-repair.yml \
            scripts/run_stopdff_v5_local.py \
            tests/test_pr30_control_repairs.py
          git diff --cached --quiet && {
            echo "Repair produced no staged changes"
            exit 1
          }
          git commit -m "Preserve local adapter execution provenance"
          git push origin HEAD:codex/post18-v5-code
