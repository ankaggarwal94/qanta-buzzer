name: Frozen ACL 5000-question experiment

on:
  push:
    branches: [ops/acl-5000-experiment-20261002]
    paths: [.github/workflows/acl-5000-experiment.yml]

permissions:
  contents: read

concurrency:
  group: acl-5000-experiment-20261002
  cancel-in-progress: false

jobs:
  launch:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/acl-5000-experiment-20261002' &&
      github.actor == 'ankaggarwal94' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: launch frozen ACL 5000 experiment 20261002'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned submission and guard dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'modal==1.6.0' 'pytest==8.3.5'
          'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Validate execution and input restoration before credential use
        run: >-
          python -m pytest --noconftest
          tests/test_modal_acl_expansion.py
          tests/test_pack_acl_public_inputs.py
          tests/test_jane_gpu_backend.py
          tests/test_jane_output_constraints.py -q
      - name: Restore exact frozen public input bytes
        run: >-
          python scripts/pack_acl_public_inputs.py unpack
          --transport-dir acl_expansion_public
          --out-dir acl_expansion_inputs
      - name: Validate exact public inputs and bounded plan
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_acl_expansion plan
          --public-dir acl_expansion_inputs
          --run-id acl5000-20261002
          --source-commit "$SOURCE_COMMIT"
          --budget-usd 80 --max-model-seconds 57600 --shard-size 4096
      - name: Launch two bounded detached model allocations
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_acl_expansion launch
          --public-dir acl_expansion_inputs
          --run-id acl5000-20261002
          --source-commit "$SOURCE_COMMIT"
          --budget-usd 80 --max-model-seconds 57600 --shard-size 4096
          --out results/acl5000_launch
      - name: Verify both models have persisted real response progress
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PYTHON'
          import json, time
          from pathlib import Path
          from scripts.modal_acl_expansion import status
          for index in range(20):
              report = status("acl5000-20261002")
              Path("results/acl5000_launch/initial_progress.json").write_text(json.dumps(report, indent=2) + "\n")
              rows = report.get("evidence", {}).values()
              progressed = {row.get("model_tag") for row in rows if row.get("observed_completed_jobs", row.get("completed_jobs", 0)) > 0}
              failed = [row for row in rows if str(row.get("status", "")).startswith("FAILED")]
              if failed:
                  print(json.dumps(report, sort_keys=True))
                  raise RuntimeError("A model reported an execution failure; no automatic relaunch")
              if progressed == {"qwen3b", "qwen7b"}:
                  print(json.dumps(report, sort_keys=True))
                  break
              if index < 19:
                  time.sleep(30)
          else:
              print(json.dumps(report, sort_keys=True))
              raise RuntimeError("Initial progress not yet verified; detached allocations may still be active")
          PYTHON
      - name: Preserve immutable launch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acl5000-launch-${{ github.run_id }}
          path: results/acl5000_launch/
          if-no-files-found: warn
          retention-days: 90
