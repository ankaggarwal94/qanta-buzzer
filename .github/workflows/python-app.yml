# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
    - name: Test with pytest
      run: |
        pytest tests/ -q --tb=short

  repair-pr30-model-cache:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 30
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Guard bounded transaction
      shell: bash
      run: |
        set -euo pipefail
        test -f .github/pr30_model_cache_repair.py
        ! grep -q 'def _model_cache_state' scripts/modal_stopdff_v5_runner.py
        echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Apply adjudicated repair
      shell: bash
      run: |
        set -euo pipefail
        python .github/pr30_model_cache_repair.py
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Focused verification
      shell: bash
      run: |
        set -euo pipefail
        pytest tests/test_pr30_control_repairs.py -q --tb=short -k 'freeze_model'
        flake8 scripts/modal_stopdff_v5_runner.py tests/test_pr30_control_repairs.py --select=E9,F63,F7,F82 --show-source --statistics
    - name: Prepare clean candidate commit
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add scripts/modal_stopdff_v5_runner.py tests/test_pr30_control_repairs.py
        git commit -m "Reject noncanonical fresh model caches"
        test -z "$(git status --porcelain)"
    - name: Full verification
      shell: bash
      run: |
        set -euo pipefail
        pytest tests/ -q --tb=short
    - name: CAS-push verified repair
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin "${{ github.event.pull_request.head.ref }}"
        REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
        test "$REMOTE_HEAD" = "$START_HEAD" || {
          echo "Branch moved from $START_HEAD to $REMOTE_HEAD; refusing to push"
          exit 78
        }
        git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
