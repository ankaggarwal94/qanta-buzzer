# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify merge-ref checkout
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        actual_sha="$(git rev-parse HEAD)"
        test "$actual_sha" = "$EXPECTED_SHA"
        case "$GITHUB_REF" in
          refs/pull/*/merge) ;;
          *) echo "unexpected pull-request ref: $GITHUB_REF" >&2; exit 1 ;;
        esac
        echo "verified_merge_ref_sha=$actual_sha"
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
    - name: Test with pytest
      run: |
        pytest tests/ -q --tb=short

  literal-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Verify literal-head checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        actual_sha="$(git rev-parse HEAD)"
        test "$actual_sha" = "$EXPECTED_SHA"
        echo "verified_literal_head_sha=$actual_sha"
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
    - name: Test with pytest
      run: |
        pytest tests/ -q --tb=short
