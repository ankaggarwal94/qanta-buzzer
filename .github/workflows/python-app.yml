# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,_legacy,artifacts,checkpoints,results,cache,repomix
    - name: Test with pytest
      run: |
        pytest tests/ -q --tb=short

  repair-pr30-split-metadata:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 30
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Guard bounded transaction
      shell: bash
      run: |
        set -euo pipefail
        test -f .github/pr30-repair-trigger
        test -f .github/pr30_split_metadata_repair.py
        ! grep -q 'def build_retained_split_metadata' scripts/build_mc_dataset.py
        echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Apply adjudicated repair
      shell: bash
      run: |
        set -euo pipefail
        python .github/pr30_split_metadata_repair.py
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e '.[dev]'
    - name: Focused verification
      shell: bash
      run: |
        set -euo pipefail
        pytest tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py -q --tb=short
        flake8 scripts/build_mc_dataset.py scripts/stopdff_v5/producers.py tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py --select=E9,F63,F7,F82 --show-source --statistics
    - name: Full verification
      shell: bash
      run: |
        set -euo pipefail
        pytest tests/ -q --tb=short
    - name: Commit and CAS-push repair
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin "${{ github.event.pull_request.head.ref }}"
        REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
        test "$REMOTE_HEAD" = "$START_HEAD" || {
          echo "Branch moved from $START_HEAD to $REMOTE_HEAD; refusing to push"
          exit 78
        }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add AGENTS.md docs/stopdff_v5/REPRODUCTION.md \
          scripts/build_mc_dataset.py scripts/stopdff_v5/producers.py \
          tests/test_build_mc_dataset.py tests/test_stopdff_v5_producers.py
        git commit -m "Fix retained split metadata contract"
        git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
