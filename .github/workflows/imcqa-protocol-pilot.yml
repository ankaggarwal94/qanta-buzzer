name: Bounded development IMCQA protocol diagnosis

on:
  push:
    branches: [feat/imcqa-wait-pilot-20261004]
    paths: [.github/workflows/imcqa-protocol-pilot.yml]

permissions:
  contents: read

concurrency:
  group: imcqa-protocol-dev-20261004
  cancel-in-progress: false

jobs:
  pilot:
    if: >-
      github.event_name == 'push' &&
      github.actor == 'ankaggarwal94' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: run reviewed protocol diagnosis under four dollars'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'modal==1.6.0' 'pytest==8.3.5' 'numpy==2.2.4'
          'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Validate the protocol before credentials
        run: >-
          python -m pytest --noconftest
          tests/test_imcqa_protocol_design.py
          tests/test_imcqa_protocol_scoring.py
          tests/test_modal_imcqa_protocol_pilot.py -q
      - name: Verify frozen transport and completed decomposition
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root = Path('imcqa_protocol_public')
          manifest = json.loads((root/'transport_manifest.json').read_text())
          gate = json.loads((root/'decomposition_gate.json').read_text())
          assert gate['status'] == 'complete' and gate['verified_trajectories'] == 800
          assert gate['inference_calls'] == 0
          assert hashlib.sha256(Path('scripts/analyze_imcqa_wait_decomposition.py').read_bytes()).hexdigest() == gate['analyzer_sha256']
          packed = (root/'public.json.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == manifest['compressed_sha256']
          raw = gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == manifest['public_sha256']
          assert hashlib.sha256(Path('configs/imcqa_protocol_pilot.json').read_bytes()).hexdigest() == manifest['config_sha256']
          assert manifest['contexts_per_model'] == 5232 and manifest['real_questions'] == 40
          assert manifest['execution'] == {'new': 4032, 'reuse': 1200}
          assert manifest['real_gold_labels_included'] is False
          Path('imcqa_protocol_run_artifacts').mkdir(exist_ok=True)
          Path('imcqa_protocol_run_artifacts/public.json').write_bytes(raw)
          PY
      - name: Score the bounded protocol diagnosis
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_imcqa_protocol_pilot
          --public-package imcqa_protocol_run_artifacts/public.json
          --source-commit "$SOURCE_COMMIT"
          --out imcqa_protocol_run_artifacts/imcqa_protocol_pilot
      - name: Preserve scores and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imcqa-protocol-pilot-${{ github.run_id }}
          path: imcqa_protocol_run_artifacts/
          if-no-files-found: warn
          retention-days: 90
