name: Bounded numerical and binary-controller follow-up

on:
  push:
    branches: [feat/imcqa-wait-pilot-20261004]
    paths: [.github/workflows/imcqa-factorized-followup.yml]

permissions:
  contents: read

concurrency:
  group: imcqa-factorized-followup-20261004
  cancel-in-progress: false

jobs:
  numerical_diagnostic:
    if: >-
      github.actor == 'ankaggarwal94' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: run reviewed factorized followup within four dollars'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'modal==1.6.0' 'pytest==8.3.5' 'numpy==2.2.4'
          'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Validate diagnostic before credentials
        run: python -m pytest --noconftest tests/test_imcqa_3b_numerical_diagnostic.py -q
      - name: Run the frozen numerical diagnostic
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_imcqa_3b_numerical_diagnostic
          --manifest imcqa_3b_numerics_public/manifest.json
          --source-commit "$SOURCE_COMMIT"
          --out imcqa_3b_numerics_run_artifacts/imcqa_3b_numerics
      - name: Preserve numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imcqa-3b-numerics-${{ github.run_id }}
          path: imcqa_3b_numerics_run_artifacts/
          if-no-files-found: warn
          retention-days: 90

  binary_controller:
    if: >-
      github.actor == 'ankaggarwal94' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: run reviewed factorized followup within four dollars'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'modal==1.6.0' 'pytest==8.3.5' 'numpy==2.2.4'
          'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Validate controller before credentials
        run: >-
          python -m pytest --noconftest tests/test_imcqa_binary_design.py
          tests/test_imcqa_binary_scoring.py tests/test_modal_imcqa_binary_pilot.py -q
      - name: Verify frozen controller inputs
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root = Path('imcqa_binary_public')
          manifest = json.loads((root/'transport_manifest.json').read_bytes())
          packed = (root/'public.json.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == manifest['compressed_sha256']
          raw = gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == manifest['public_sha256']
          assert hashlib.sha256(Path('configs/imcqa_binary_pilot.json').read_bytes()).hexdigest() == manifest['config_sha256']
          assert manifest['contexts_per_model'] == 832 and manifest['n_questions'] == 40
          assert manifest['real_contexts_per_model'] == 800 and manifest['synthetic_contexts_per_model'] == 32
          assert manifest['real_gold_or_confidence_included'] is False
          Path('imcqa_binary_run_artifacts').mkdir(exist_ok=True)
          Path('imcqa_binary_run_artifacts/public.json').write_bytes(raw)
          PY
      - name: Score the bounded binary controller
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_imcqa_binary_pilot
          --public-package imcqa_binary_run_artifacts/public.json
          --source-commit "$SOURCE_COMMIT"
          --out imcqa_binary_run_artifacts/imcqa_binary_pilot
      - name: Preserve controller scores and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imcqa-binary-${{ github.run_id }}
          path: imcqa_binary_run_artifacts/
          if-no-files-found: warn
          retention-days: 90
