name: Watch frozen tuned IMCQA recovery without compute

on:
  push:
    branches: [feat/imcqa-tuned-policy-comparison-20261005]
    paths: [.github/workflows/imcqa-tuned-recovery-watch.yml]

permissions:
  contents: read

concurrency:
  group: imcqa-tuned-recovery-watch-20261006
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.event_name == 'push' &&
      github.actor == 'ankaggarwal94' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: watch frozen tuned IMCQA recovery without compute'
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned observer dependency
        run: python -m pip install --disable-pip-version-check 'modal==1.6.0'
      - name: Read existing recovery metadata 00
        id: snapshot_00
        if: success() && env.IMCQA_WATCH_COMPLETE != 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m scripts.imcqa_tuned_watch --index 0
      - name: Preserve snapshot 00 immediately
        if: always() && steps.snapshot_00.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: imcqa-tuned-recovery-watch-${{ github.run_id }}-00
          path: imcqa_tuned_recovery_watch/snapshot-00.json
          if-no-files-found: error
          retention-days: 90
      - name: Wait ten minutes before next bounded snapshot
        if: success() && env.IMCQA_WATCH_COMPLETE != 'true'
        run: sleep 600
      - name: Read existing recovery metadata 01
        id: snapshot_01
        if: success() && env.IMCQA_WATCH_COMPLETE != 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m scripts.imcqa_tuned_watch --index 1
      - name: Preserve snapshot 01 immediately
        if: always() && steps.snapshot_01.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: imcqa-tuned-recovery-watch-${{ github.run_id }}-01
          path: imcqa_tuned_recovery_watch/snapshot-01.json
          if-no-files-found: error
          retention-days: 90
      - name: Wait ten minutes before next bounded snapshot
