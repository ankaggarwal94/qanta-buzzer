name: Bounded Mistral IMCQA development

on:
  push:
    branches: [feat/imcqa-mistral-replication-20261007]
    paths: [.github/workflows/imcqa-mistral-replication.yml]

permissions:
  contents: read

concurrency:
  group: imcqa-mistral-eight-usd-v1
  cancel-in-progress: false

jobs:
  development:
    if: >-
      github.event_name == 'push' &&
      github.actor == 'ankaggarwal94' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ops: run approved eight-dollar Mistral development once'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.12'
      - name: Install pinned control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'modal==1.6.0' 'pytest==8.3.5' 'numpy==2.2.4' 'scipy==1.15.2'
          'PyYAML==6.0.2' 'lm-format-enforcer==0.11.3' 'interegular==0.3.3'
      - name: Test data, numeric evidence, selection and spending gates before credentials
        run: >-
          python -m pytest --noconftest
          tests/test_imcqa_mistral_design.py tests/test_imcqa_mistral_scoring.py
          tests/test_modal_imcqa_mistral.py tests/test_analyze_imcqa_mistral.py
          tests/test_imcqa_mistral_workflow.py -q
      - name: Reconstruct exact public prompts without evaluator labels
        run: >-
          python -m scripts.imcqa_mistral_design --transport-root .
          --public-bindings imcqa_mistral_public/public_bindings.json
          --out imcqa_mistral_run_artifacts/public
      - name: Validate bounded cache control without provider access
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_imcqa_mistral prepare-cache
          --run-id imcqa-mistral-oct7-a1 --source-commit "$SOURCE_COMMIT"
          --rate-verified-utc 2026-10-07T23:15:00Z
          --out imcqa_mistral_run_artifacts/dry-run --dry-run
      - name: Prepare one bounded model cache allocation
        id: cache
        timeout-minutes: 24
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python -m scripts.modal_imcqa_mistral prepare-cache
          --run-id imcqa-mistral-oct7-a1 --source-commit "$SOURCE_COMMIT"
          --rate-verified-utc 2026-10-07T23:15:00Z
          --out imcqa_mistral_run_artifacts/cache
      - name: Score development once with no retry
        id: score
        timeout-minutes: 36
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          python -m scripts.modal_imcqa_mistral score-stage --stage development
          --cache-control imcqa_mistral_run_artifacts/cache/control.json
          --prepare-receipt imcqa_mistral_run_artifacts/cache/output/prepare_receipt.json
          --public-package imcqa_mistral_run_artifacts/public/development_public.json
          --stage-manifest imcqa_mistral_run_artifacts/public/development_stage_manifest.json
          --out imcqa_mistral_run_artifacts/development
      - name: Delete only this run's model cache after any failed stage
        if: ${{ always() && steps.score.outcome != 'success' && hashFiles('imcqa_mistral_run_artifacts/cache/control.json') != '' }}
        timeout-minutes: 3
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          python -m scripts.modal_imcqa_mistral cleanup-cache
          --control imcqa_mistral_run_artifacts/cache/control.json
          --out imcqa_mistral_run_artifacts/cache_cleanup.json
      - name: Preserve complete or partial scores and all receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imcqa-mistral-development-${{ github.run_id }}
          path: imcqa_mistral_run_artifacts/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
