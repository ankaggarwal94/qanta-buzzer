name: Smoke pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run smoke pipeline
        run: |
          bash scripts/manual-smoke.sh

      - name: Verify no absolute home-directory leaks
        run: |
          ! grep -R "/home/runner\|/Users/" artifacts/smoke || (echo "absolute path leak detected" && exit 1)
