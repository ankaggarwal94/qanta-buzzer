name: Smoke pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create repo-local venv and install package
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Run smoke pipeline
        run: |
          bash scripts/manual-smoke.sh

      - name: Verify no absolute home-directory leaks
        if: always()
        run: |
          if [ ! -d artifacts/smoke ]; then
            echo "artifacts/smoke not produced; nothing to check"
            exit 0
          fi
          if grep -R "/home/runner\|/Users/" artifacts/smoke; then
            echo "absolute path leak detected" >&2
            exit 1
          fi
