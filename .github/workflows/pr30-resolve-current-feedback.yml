name: PR30 bounded review repair

on:
  push:
    branches:
      - codex/post18-v5-code
    paths:
      - .github/workflows/pr30-resolve-current-feedback.yml

permissions:
  contents: read

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post18-v5-code
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify bounded transaction inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ff81121d4a33f5aeba3d2d8ffc59d812a3ba35d5"
          echo "cc45a9ed17c5e82839ce494cd520e0d082e78122efe6a37a44d7b732ee2a7d4e  .github/pr30_resolve_feedback.py" | sha256sum --check --strict
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply adjudicated repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/pr30_resolve_feedback.py
          python -m py_compile \
            scripts/modal_stopdff_v5_runner.py \
            scripts/stopdff_v5/adapter_build.py \
            scripts/stopdff_v5/checker.py \
            tests/test_pr30_control_repairs.py \
            tests/test_stopdff_v5_adapter_build.py \
            tests/test_stopdff_v5_checker.py
          rm .github/pr30_resolve_feedback.py
          rm .github/workflows/pr30-resolve-current-feedback.yml
          git diff --check

      - name: Commit and compare-and-swap push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/post18-v5-code
          test "$(git rev-parse origin/codex/post18-v5-code)" = "$START_HEAD" || {
            echo "Branch moved during the bounded transaction; refusing to push"
            exit 78
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/pr30_resolve_feedback.py \
            .github/workflows/pr30-resolve-current-feedback.yml \
            scripts/modal_stopdff_v5_runner.py \
            scripts/stopdff_v5/adapter_build.py \
            scripts/stopdff_v5/checker.py \
            tests/test_pr30_control_repairs.py \
            tests/test_stopdff_v5_adapter_build.py \
            tests/test_stopdff_v5_checker.py
          git diff --cached --quiet && {
            echo "Repair produced no staged changes"
            exit 1
          }
          git commit -m "Resolve current PR30 review feedback"
          git push origin HEAD:codex/post18-v5-code
