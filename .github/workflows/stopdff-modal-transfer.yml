# Revision 5: bind the endpoint to the verified separate V2 rerun volume.
name: StopDFF authenticated input transfer
on:
  push:
    branches: [ops/stopdff-durable-rerun-20260920]
    paths: [.github/workflows/stopdff-modal-transfer.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stopdff-input-transfer-20260920
  cancel-in-progress: false
jobs:
  transfer-endpoint:
    if: github.ref == 'refs/heads/ops/stopdff-durable-rerun-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Deploy bounded authenticated transfer endpoint
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          import hashlib, hmac, os, subprocess, time
          env = os.environ.copy()
          if not env.get('MODAL_TOKEN_ID') or not env.get('MODAL_TOKEN_SECRET'):
              raise SystemExit('Required Modal credentials unavailable')
          env['STOPDFF_TRANSFER_TOKEN'] = hmac.new(
              env['MODAL_TOKEN_SECRET'].encode(), b'stopdff-input-transfer-20260920', hashlib.sha256
          ).hexdigest()
          env['STOPDFF_TRANSFER_EXPIRES'] = str(int(time.time()) + 3600)
          env['STOPDFF_TRANSFER_DEPLOY'] = '1'
          subprocess.run(['modal', 'deploy',
              'reproducibility/durable_stopdff_20260920/transfer_modal.py'], env=env, check=True)
          PY
      - name: Check authenticated transfer readiness (metadata only)
        env:
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, re, urllib.error, urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          secret = os.environ.get('MODAL_TOKEN_SECRET')
          if not secret:
              raise SystemExit('Required Modal credential unavailable')
          token = hmac.new(secret.encode(), b'stopdff-input-transfer-20260920', hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://ankaggarwal94--stopdff-input-transfer-20260920-transfer-api.modal.run/status',
              method='GET', headers={'X-Transfer-Token': token, 'Accept': 'application/json'})
          try:
              response = urllib.request.build_opener(NoRedirect()).open(request, timeout=145)
          except urllib.error.HTTPError as error:
              response = error
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit('Readiness request failed before an HTTP response') from None
          with response:
              code = response.code
              raw = response.read(4097)
          safe = {'http_status': code}
          try:
              payload = json.loads(raw) if len(raw) <= 4096 else None
          except (ValueError, UnicodeError):
              payload = None
          if not isinstance(payload, dict):
              print(json.dumps({**safe, 'status': 'invalid_or_oversized_response'}))
              raise SystemExit('Transfer readiness check failed')
          if payload.get('status') in ('uploading', 'complete', 'error'):
              safe['status'] = payload['status']
          detail = payload.get('detail')
          if isinstance(detail, str):
              known = ('unauthorized', 'transfer expired', 'transfer request limit exceeded',
                       'storage mount backing mismatch', 'storage mount backing unavailable',
                       'request deadline exceeded', 'storage operation failed; retry safely')
              diagnostic = r'storage path conflict: (mount|namespace|inputs|staging) \((regular|symlink|fifo|socket|block_device|character_device|unknown)\)'
              safe['detail'] = detail if detail in known or re.fullmatch(diagnostic, detail) else 'unrecognized server diagnostic'
          expected_sha = '6afc62e1cb91d0d2ac958c251ba68aec1c83f2da2b9d0354dc4635234dbc1cf2'
          expected_size = 1234697660
          for key, expected in (('sha256', expected_sha), ('size', expected_size), ('chunk_count', 37)):
              if payload.get(key) == expected:
                  safe[key] = expected
          received = payload.get('received_chunks')
          if isinstance(received, list) and len(received) <= 37 and all(
              type(index) is int and 0 <= index < 37 for index in received
          ) and len(set(received)) == len(received):
              safe['received_chunks'] = received
          print(json.dumps(safe, sort_keys=True, separators=(',', ':')))
          if not (code == 200 and safe.get('status') in ('uploading', 'complete')
                  and safe.get('sha256') == expected_sha and safe.get('size') == expected_size
                  and safe.get('chunk_count') == 37 and 'received_chunks' in safe):
              raise SystemExit('Transfer readiness check failed')
          PY
