name: FirstBuzz proof

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: FirstBuzz frozen comparator
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the verifier to the event commit and reviewed digest
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            pull_request) [[ "$GITHUB_REF" == refs/pull/*/merge ]] ;;
            merge_group) test "$QUEUE_SHA" = "$GITHUB_SHA" ;;
          esac
          git --no-replace-objects cat-file blob "$GITHUB_SHA:formal/first_buzz/verify.py" > "$RUNNER_TEMP/first-buzz.py"
          echo "6400885613d8a279c421d4d02fe7fb2fbba66c1311e37d4f5020a87ba15b5b34  $RUNNER_TEMP/first-buzz.py" | sha256sum -c -
      - name: Install the pinned Lean toolchain and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap zstd
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Compare the three frozen declarations at this revision
        run: |
          python3 -I "$RUNNER_TEMP/first-buzz.py" --repo "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --freeze-sha256 8edf5836f3e40e6e9e38c5516841889a69d1528aa7bd9f1986ead0ba633fdc91
