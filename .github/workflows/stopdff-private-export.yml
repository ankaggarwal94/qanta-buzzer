name: Export the verified existing StopDFF result encrypted
on:
  push:
    branches: [ops/stopdff-private-export-20260921]
    paths: [.github/workflows/stopdff-private-export.yml]
permissions:
  contents: read
concurrency:
  group: stopdff-private-existing-result-export-20260921
  cancel-in-progress: false
jobs:
  export-existing-encrypted:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/stopdff-private-export-20260921' &&
      github.event.head_commit.message == 'ops: privately export existing verified StopDFF result 20260921' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: export-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dee0ab56a2bfb191269f90f36a0d67022bf6c0df
          path: monitor-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ede184cf77369022ca7cd5fe51b9318573d85630
          path: submission
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install pinned read client
        run: python -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Verify existing durable result and encrypt it locally
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python "$GITHUB_WORKSPACE/export-control/reproducibility/private_export_20260921/export_existing.py" \
            --monitor-root "$GITHUB_WORKSPACE/monitor-control" \
            --submission-root "$GITHUB_WORKSPACE/submission" \
            --private-dir "$RUNNER_TEMP/stopdff-private-evidence" \
            --encrypted-dir "$RUNNER_TEMP/stopdff-encrypted-evidence" \
            --certificate "$GITHUB_WORKSPACE/export-control/reproducibility/private_export_20260921/recipient.pem"
      - name: Retain only authenticated ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: stopdff-encrypted-full-35536866002-1
          path: ${{ runner.temp }}/stopdff-encrypted-evidence/full-35536866002-1.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
