name: ACL expansion verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install pinned Lean and sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap zstd
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Verify first-buzz mass and expected score
        run: lean -DwarningAsError=true formal/FirstBuzz.lean
      - name: Check frozen challenges and altered-definition rejection
        run: |
          python formal/acl_expansion/verify.py --freeze-sha256 873dc65663c7bc59359bb77ea7b111e6b385a92cf3053a0795d46915c6022f5c --law-freeze-sha256 9d7a420ee917caf13a314fcc625930365a2c76904b93ffdaecf4eeb59523d75c --wire-freeze-sha256 352464ab213fc34363d04122ae37071fb7d45c704d6ee3abd7c058b3f184ff9a --negative-control
          python formal/acl_curves/verify.py --freeze-sha256 dc1277deb55950615066a66915fbf4b60a7c826aeea25a28e3ecc9ae2b9bea49 --bridge-freeze-sha256 d11a8e03ca4a7ee843d25761759ac90339a60f831f6c0649d9cc026d8fb3a560
      - name: Build and probe the production core offline
        run: python formal/acl_expansion/build_runtime.py --freeze-sha256 b15dec870259717ec14b84112935fc2918f05b6173d8d5f84025e7827f2acd24 --install
      - name: Install CPU learners
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
          python -m pip install -c configs/acl_expansion/runtime-constraints.txt -e '.[acl-verified,acl-private-review]' pytest lm-format-enforcer==0.11.3 interegular==0.3.3
          python -m pip check
      - name: Check protocols and runtime mutations
        run: |
          python -m pytest -q tests/test_acl*.py
          python -m scripts.acl_reward_mutations
      - name: Reconstruct and verify public ACL prompts
        run: |
          git fetch --no-tags --depth=1 https://github.com/ankaggarwal94/qanta-buzzer.git c5981d913165f8dc24173c3ec8615b221cfc944d
          python -m scripts.acl_upstream_conformance
          python -m scripts.verify_acl_public_prompts --out artifacts/acl_expansion/public_conformance.json
      - name: Train, infer and replay every arm
        run: |
          python -m scripts.acl_expansion smoke --config configs/acl_expansion/smoke.yaml --lean-core --policy ppo --out artifacts/acl_expansion
          python -m scripts.acl_expansion smoke --config configs/acl_expansion/smoke.yaml --lean-core --policy t5 --out artifacts/acl_expansion
          python -m scripts.acl_smoke_receipt artifacts/acl_expansion/smoke-ppo-*.json artifacts/acl_expansion/smoke-t5-*.json --out artifacts/acl_expansion/learner_smokes.json
      - name: Run matched public-only model smoke
        run: |
          python -m scripts.acl_paired_inference export --config configs/acl_expansion/paired_imcqa_smoke.yaml --imcqa --out artifacts/acl_expansion/paired/public.json
          python -m venv --system-site-packages "$RUNNER_TEMP/acl-paired"
          "$RUNNER_TEMP/acl-paired/bin/python" -m pip install transformers==4.51.3 tokenizers==0.21.1 huggingface-hub==0.30.2 lm-format-enforcer==0.11.3 interegular==0.3.3
          "$RUNNER_TEMP/acl-paired/bin/python" -m scripts.acl_paired_cpu_inference --public artifacts/acl_expansion/paired/public.json --out artifacts/acl_expansion/paired/responses.json
          python -m scripts.acl_paired_inference score --config configs/acl_expansion/paired_imcqa_smoke.yaml --imcqa --responses artifacts/acl_expansion/paired/responses.json --out artifacts/acl_expansion/paired/grades.json
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          rows = json.loads(Path("artifacts/acl_expansion/paired/grades.json").read_bytes())["rows"]
          expected = Counter((arm, prefix) for arm in ("oe", "mc", "forced", "wait") for prefix in range(5))
          if Counter((r["arm"], r["prefix_index"]) for r in rows) != expected:
              raise ValueError("paired smoke has incomplete or duplicated coverage")
          if any(r["grade"] == "invalid" for r in rows):
              raise ValueError("paired smoke returned an invalid completion")
          actual = json.loads(Path("artifacts/acl_expansion/paired/responses.json").read_bytes())
          recorded = json.loads(Path("docs/acl_expansion/evidence/paired_smoke_trace.json").read_bytes())
          def actions(trace):
              return {r["job_id"]: (r["prompt_sha256"], r["response"]) for r in trace["responses"]}
          if actual["public_sha256"] != recorded["public_sha256"] or actions(actual) != actions(recorded):
              raise ValueError("paired smoke differs from the recorded public jobs or decisions")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acl-smoke-receipts
          if-no-files-found: error
          path: |
            artifacts/acl_expansion/smoke-*.json
            artifacts/acl_expansion/*/completed.json
            artifacts/acl_expansion/*/manifest.json
            artifacts/acl_expansion/*/menus.json
            artifacts/acl_expansion/*/*_episodes.json
            artifacts/acl_expansion/*/train-*/**
            artifacts/acl_expansion/learner_smokes.json
            artifacts/acl_expansion/public_conformance.json
            artifacts/acl_expansion/paired/
